server.port=8081
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/oficina_agua?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:consulta_ro}
spring.datasource.password=${DB_PASSWORD:consulta_ro_dev_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
ratelimit.capacity=10
ratelimit.refill-seconds=60
internal.token=${INTERNAL_TOKEN:local-dev-internal-token}
